<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Database — UFMB</title>
    <meta
        name="description"
        content="Explore the UFMB UFL MOBILE player and card database."
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="database">

<header class="site-header">
    <div class="container nav-container">

        <a href="index.html" class="brand">
            <span class="brand-mark">UFMB</span>
            <span class="brand-sub">UFL MOBILE BASE</span>
        </a>

        <button
            class="mobile-menu-button"
            id="mobileMenuButton"
            aria-label="Open navigation"
            aria-expanded="false"
        >
            ☰
        </button>

        <nav class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="database.html" class="active">Database</a>
            <a href="latest.html">Latest</a>
            <a href="about.html">About</a>
        </nav>

    </div>
</header>


<main>

    <section class="page-header">
        <div class="container">

            <span class="section-kicker">UFMB DATABASE</span>

            <h1>PLAYER DATABASE</h1>

            <p>
                Search and filter the current UFMB player collection.
            </p>

        </div>
    </section>


    <section class="database-section">
        <div class="container">

            <div class="database-toolbar">

                <div class="search-wrapper">
                    <label for="searchInput">Search</label>

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search player, nation, position..."
                        autocomplete="off"
                    >
                </div>


                <div class="filter-wrapper">
                    <label for="ovrFilter">Minimum OVR</label>

                    <select id="ovrFilter">
                        <option value="">Any OVR</option>
                        <option value="90">90+</option>
                        <option value="91">91+</option>
                        <option value="92">92+</option>
                        <option value="93">93+</option>
                        <option value="94">94+</option>
                        <option value="95">95+</option>
                        <option value="96">96+</option>
                        <option value="97">97+</option>
                        <option value="98">98+</option>
                        <option value="99">99</option>
                    </select>
                </div>


                <div class="filter-wrapper">
                    <label for="positionFilter">Position</label>

                    <select id="positionFilter">
                        <option value="">All positions</option>
                    </select>
                </div>


                <div class="filter-wrapper">
                    <label for="versionFilter">Card</label>

                    <select id="versionFilter">
                        <option value="">All cards</option>
                    </select>
                </div>

            </div>


            <div class="database-result-bar">
                <span id="resultCount">Loading...</span>
            </div>


            <div id="databaseGrid" class="player-grid">
                <div class="loading-box">
                    Loading database...
                </div>
            </div>

        </div>
    </section>

</main>


<footer class="site-footer">
    <div class="container footer-content">

        <div>
            <strong>UFMB</strong>
            <span>UFL MOBILE BASE</span>
        </div>

        <p>
            Independent community project.
        </p>

        <p>
            © <span id="currentYear"></span> UFMB
        </p>

    </div>
</footer>


<div id="playerModal" class="modal" hidden></div>


<script src="js/player-card.js"></script>
<script src="js/database.js"></script>
<script src="js/app.js"></script>

</body>
</html>
